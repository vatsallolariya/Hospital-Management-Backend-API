name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hospital_api
          POSTGRES_USER: hospital_api
          POSTGRES_PASSWORD: hospital_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: hospital_api
      POSTGRES_USER: hospital_api
      POSTGRES_PASSWORD: hospital_api
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.test

      - name: Run tests with coverage
        run: |
          coverage run manage.py test --settings=config.settings.test --noinput
          coverage report -m
