services:
  db:
    image: postgres:15
    container_name: hospital_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_api}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_api}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital_api} -d ${POSTGRES_DB:-hospital_api}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
